name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: pip install -r requirements-dev.txt
      - name: Check formatting
        run: ruff format --check scripts analysis checks tests v3
      - name: Run tests (no GPU needed, uses fake vllm commands)
        run: pytest -q
