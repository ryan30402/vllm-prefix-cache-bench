name: p1024_c16_cache_on
model: Qwen/Qwen2.5-7B-Instruct

server:
  prefix_caching: true          # true = 開，false = 加 --no-enable-prefix-caching
  max_model_len: 8192
  gpu_memory_utilization: 0.90
  max_num_seqs: 256
  port: 8000

bench:
  prefix_len: 1024
  suffix_len: 256
  num_prefixes: 1
  output_len: 128
  num_prompts: 500
  max_concurrency: 16
  warmup_prompts: 50
