# Clean runs at concurrency 128 with the v2 harness: the largest v1 gain
# (prefix 4096) and the baseline for the memory-pressure runs (prefix 2048).
tag: clean
model: Qwen/Qwen2.5-7B-Instruct
repeats: 3
order: paired_random
order_seed: 9
server_base: {max_model_len: 8192, gpu_memory_utilization: 0.90, max_num_seqs: 256, port: 8000}
bench_base: {suffix_len: 256, output_len: 128, num_prompts: 500, warmup_prompts: 50, workload_seed: 0}
sweep:
  prefix_caching: [false, true]
  prefix_len: [2048, 4096]
  max_concurrency: [128]
