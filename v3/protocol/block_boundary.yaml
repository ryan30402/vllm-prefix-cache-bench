# v3 block-boundary diagnostic: 4 prefix lengths around a 16-token block
# boundary x cache off/on x 3 rounds = 24 runs. Separate from the main matrix.
# Cacheable tokens per request: 2047 -> 2032, 2048 -> 2048, 2049 -> 2048,
# 2064 -> 2064. One token short of a boundary loses a whole block.
name: block_boundary
batch: 1
rounds: 3
order_seed: 3002
model: Qwen/Qwen2.5-7B-Instruct
model_revision: a09a35458c702b33eeacc393d103063234e8bc28

server:
  port: 8000
  max_model_len: 8192
  gpu_memory_utilization: 0.90
  max_num_seqs: 256
  max_num_batched_tokens: 2048   # vLLM's own default on this GPU class, pinned
  generation_config: vllm        # neutral sampling defaults, not the model's file
  seed: 0

bench:
  temperature: 0.0               # greedy decoding
  timeout_s: 7200
  warmup_timeout_s: 1800

telemetry:
  required: true
  interval_s: 2

validity:
  max_pair_attempts: 3           # failed attempts per pair before it is reported as unmeasured

workload:
  suffix_len: 256
  output_len: 128
  num_prompts: 500
  warmup_prompts: 50
  seed: 0
  block_size: 16

conditions:
  grid:
    prefix_len: [2047, 2048, 2049, 2064]
    concurrency: [32]
