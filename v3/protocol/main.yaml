# v3 main matrix: 5 prefix lengths x 4 concurrency levels x cache off/on
# x 3 rounds = 120 runs, 60,000 measured and 6,000 warm-up requests.
# Every round visits all 20 conditions in a new random order; cache off and on
# of a condition run back to back. order_seed was fixed before any run.
name: main
batch: 1
rounds: 3
order_seed: 3001
model: Qwen/Qwen2.5-7B-Instruct
model_revision: a09a35458c702b33eeacc393d103063234e8bc28

server:
  port: 8000
  max_model_len: 8192
  gpu_memory_utilization: 0.90
  max_num_seqs: 256
  max_num_batched_tokens: 2048   # vLLM's own default on this GPU class, pinned
  generation_config: vllm        # neutral sampling defaults, not the model's file
  seed: 0

bench:
  temperature: 0.0               # greedy decoding
  timeout_s: 7200
  warmup_timeout_s: 1800

telemetry:
  required: true
  interval_s: 2

validity:
  max_pair_attempts: 3           # failed attempts per pair before it is reported as unmeasured

workload:
  suffix_len: 256
  output_len: 128
  num_prompts: 500
  warmup_prompts: 50
  seed: 0
  block_size: 16

conditions:
  grid:
    prefix_len: [0, 256, 1024, 2048, 4096]
    concurrency: [1, 8, 32, 128]
