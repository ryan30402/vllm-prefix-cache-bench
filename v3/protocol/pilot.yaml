# v3 GPU pilot: 5 conditions x cache off/on x 2 rounds = 20 runs, with the full
# 50 warm-up + 500 measured requests. It checks the measurement contract on real
# vLLM, gives a first look at run-to-run variation and at the time per run.
# Pilot data is kept in its own folder and is never mixed into the main matrix.
#
# prefix 2040 is not a multiple of 16: with 16-token blocks a request can reuse
# 2032 tokens, with any other block size a different number. The exact-hit check
# therefore confirms the block size on this machine.
name: pilot
batch: 1
rounds: 2
order_seed: 3000
model: Qwen/Qwen2.5-7B-Instruct
model_revision: a09a35458c702b33eeacc393d103063234e8bc28

server:
  port: 8000
  max_model_len: 8192
  gpu_memory_utilization: 0.90
  max_num_seqs: 256
  max_num_batched_tokens: 2048   # vLLM's own default on this GPU class, pinned
  generation_config: vllm        # neutral sampling defaults, not the model's file
  seed: 0

bench:
  temperature: 0.0               # greedy decoding
  timeout_s: 7200
  warmup_timeout_s: 1800

telemetry:
  required: true
  interval_s: 2

validity:
  max_pair_attempts: 3           # failed attempts per pair before it is reported as unmeasured

workload:
  suffix_len: 256
  output_len: 128
  num_prompts: 500
  warmup_prompts: 50
  seed: 0
  block_size: 16

conditions:
  list:
    - {prefix_len: 0, concurrency: 32}
    - {prefix_len: 2040, concurrency: 32}
    - {prefix_len: 2048, concurrency: 1}
    - {prefix_len: 2048, concurrency: 128}
    - {prefix_len: 4096, concurrency: 128}
